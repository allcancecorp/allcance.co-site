server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect /allsales to subdomain
    location /allsales {
        return 301 https://allsales.allcance.co/;
    }

    # Static subfolders (PDFs, docs) — serve directly
    location ~* ^/(allcare|alltomate|cookies|inst|landpage|lgpd|nr1|persuasao|psi-nr1|recrutamento|termos-de-uso)/ {
        try_files $uri $uri/ =404;
    }

    # Cache assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React SPA — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
